<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catan · Team B</title>
    <link rel="icon" href="./resources/icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="./styles.css" />
</head>
<body class="game-page catan-theme">
    <header class="app-header game-hero catan-hero">
        <nav class="site-nav" aria-label="Main navigation">
            <a href="./index.html">Overview</a>
            <a href="./ticket-to-ride.html">Ticket to Ride</a>
            <a class="active" href="./catan.html">Catan</a>
        </nav>
        <div class="header-content">
            <div class="catan-tiles" aria-hidden="true">
                <span class="tile-forest"></span><span class="tile-fields"></span><span class="tile-hills"></span><span class="tile-mountains"></span><span class="tile-pasture"></span>
            </div>
            <p class="eyebrow">Team B Settlers Council</p>
            <h1>Catan</h1>
            <a id="gameInfoLink" class="header-link" target="_blank" rel="noreferrer">BoardGameGeek ↗</a>
        </div>
    </header>
    <main class="container">
        <section class="game-section"><h2 class="section-title"><span>I</span> Settlers council</h2><div id="catanStats" class="player-stats-grid"></div></section>
        <section class="game-section"><h2 class="section-title"><span>II</span> Victors of the island</h2><div id="bestList" class="best-grid"></div></section>
        <section class="game-section">
            <h2 class="section-title"><span>III</span> Chronicle of settlements</h2>
            <div class="table-container"><table id="catanTable" class="flat-table catan-table"></table></div>
        </section>
    </main>
    <dialog id="catanGameDialog" class="catan-game-dialog" aria-labelledby="catanGameDialogTitle">
        <div class="catan-dialog-panel">
            <header class="catan-dialog-header">
                <div>
                    <p id="catanGameDialogDate" class="catan-dialog-date"></p>
                    <h2 id="catanGameDialogTitle">Game details</h2>
                </div>
                <button class="catan-dialog-close" type="button" aria-label="Close game details">&times;</button>
            </header>
            <div id="catanGameDialogContent"></div>
        </div>
    </dialog>
    <footer class="footer"><div class="footer-inner">Made by <a href="https://github.com/GrigoryanArtem" target="_blank" rel="noreferrer">KindComrade</a></div></footer>
    <script src="./common.js"></script>
    <script src="./catan.js"></script>
</body>
</html>
